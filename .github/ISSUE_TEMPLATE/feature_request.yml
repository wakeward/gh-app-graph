name: Feature request
description: Suggest catalog, methodology, or tooling improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include whether this is data (YAML), eval logic, or docs
    validations:
      required: true
