name: Refresh inventory

on:
  schedule:
    # Monday 06:00 UTC - cheap, fully-automatable drift detection only.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate inventory and resolved graph
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch octokit inventory
        run: go run ./cmd/fetch-inventory

      - name: Detect overlap dependencies
        run: go run ./cmd/detect-overlap

      - name: Build resolved graph and docs
        run: go run ./cmd/build

      - name: Run unit tests
        run: go test ./...

      - name: Create pull request on drift
        uses: peter-evans/create-pull-request@271a8d0340265f3b2b0d1089225b2a2d663b3a56 # v7.0.2
        with:
          commit-message: "chore: refresh generated inventory and resolved graph"
          title: "chore: refresh generated inventory and resolved graph"
          body: |
            Automated weekly refresh from `.github/workflows/refresh.yml`.

            - `data/generated/endpoints-inventory.json`
            - `data/generated/overlap-dependencies.yaml`
            - `data/permissions.resolved.{yaml,json}`
            - `data/generated/toxic-combinations.json`
            - `docs/*.md` generated views

            Type B prose scraping (`cmd/scrape-prose`) is intentionally out of
            scope for this workflow; run that during quarterly review instead.
          branch: automation/refresh-inventory
          delete-branch: true
