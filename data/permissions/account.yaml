  access_levels:
    - access: write
      severity: Informational
      security_notes: Social graph manipulation / nuisance vector.
    - access: read
      severity: Informational
      security_notes: Public social graph enumeration; negligible security impact.
  needs_investigation: false
  doc_status: documented
  impact_plane: governance_identity
  platform_availability: all
- name: Gists
  api_key: gists
  category: account
  overview: Manage gists.
  access_levels:
    - access: write
      severity: Medium
      security_notes: Alter code snippets, host malicious scripts/payloads, or phish under a trusted user's name.
    - access: read
      severity: Low
      security_notes: Read secret gists and user snippets to discover exposed credentials, internal notes, or draft code.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Git signing SSH public keys
  api_key: git_signing_ssh_public_keys
  category: account
  overview: Manage SSH public keys used for commit signing.
  access_levels:
    - access: write
      severity: High
      security_notes: Inject an attacker-controlled public key to forge signed commits under the user identity, bypassing provenance checks.
    - access: read
      severity: Low
      security_notes: Returns public signing keys and key IDs. Cannot forge signatures without the private key; allows developer identity mapping.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: GPG keys
  api_key: gpg_keys
  category: account
  overview: Manage a user's GPG keys.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Inject a GPG public key to forge commit/tag signatures as the user, or delete legitimate keys to break signature verification.
    - access: read
      severity: Low
      security_notes: Returns public GPG keys, key IDs, and subkey capabilities. Cannot forge GPG signatures without the corresponding private key.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Interaction limits
  api_key: interaction_limits
  category: account
  overview: Manage a user's interaction limits (rate-limiting comments/PRs from certain users).
  access_levels:
    - access: write
      severity: Low
      security_notes: Lock out legitimate contributors (nuisance/DoS); limited security impact.
    - access: read
      severity: Informational
      security_notes: View active rate-limiting and interaction restrictions on personal repositories.
  needs_investigation: false
  doc_status: documented
  impact_plane: control
  platform_availability: all
- name: Git SSH keys
  api_key: keys
  category: account
  overview: Manage a user's Git SSH authentication keys.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Add an attacker-controlled SSH key to impersonate the user across any git operations and repositories they have access to.
    - access: read
      severity: Low
      security_notes: Returns public SSH keys. Cannot authenticate to git operations; useful for cross-referencing keys across external breaches.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
