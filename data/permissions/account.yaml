# See data/permissions/README.md
- name: Blocking users
  api_key: blocking
  category: account
  overview: Block and unblock other user accounts.
  access_levels:
    - access: write
      severity: Low
      security_notes: Nuisance vector - Cannot block organization administrators or alter repo access policies.
    - access: read
      severity: Informational
      security_notes: Read-only list of blocked users; negligible security impact.
  needs_investigation: false
  doc_status: documented
  impact_plane: governance_identity
  platform_availability: all
- name: Codespaces
  api_key: codespaces
  category: account
  overview: Manage user codespaces.
  access_levels:
    - access: write
      severity: High
      security_notes: Spin up malicious compute environments as the user, leading to potential cryptojacking or pivoting.
    - access: read
      severity: Low
      security_notes: Enumerate user environments to identify machine configurations and target setups for future exploitation.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Codespaces lifecycle admin
  api_key: codespaces_lifecycle_admin
  category: account
  overview: Administer lifecycle of user codespaces.
  access_levels:
    - access: write
      severity: Medium
      security_notes: Disrupt or deny development environments for a targeted developer (DoS).
    - access: read
      severity: Low
      security_notes: Enumerate developer development workflows, machine activity, and lifecycle policies.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Codespaces secrets
  api_key: codespaces_secrets
  category: account
  overview: Manage user codespaces secrets.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Overwrite personal environment secrets to redirect external service connections and capture sensitive tokens in flight.
    - access: read
      severity: Low
      security_notes: Does not expose plaintext secrets (GitHub API only exposes secret names and update timestamps). Reconnaissance only.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Codespaces user secrets
  api_key: codespaces_user_secrets
  category: account
  overview: Manage user-level codespaces secrets.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Overwrite personal environment secrets across all of the user's codespaces to hijack downstream integrations.
    - access: read
      severity: Low
      security_notes: Does not expose plaintext secrets (API returns secret names and updated dates only). Reconnaissance only.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Copilot messages
  api_key: copilot_messages
  category: account
  overview: Access a user's Copilot Chat messages.
  access_levels:
    - access: read
      severity: High
      security_notes: Exfiltrates proprietary code snippets, business logic, internal architectures, or secrets pasted into Copilot Chat.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Email addresses
  api_key: emails
  category: account
  overview: View user email addresses.
  access_levels:
