- name: Blocking users
  api_key: blocking
  category: account
  overview: Block and unblock other user accounts.
  access_levels:
    - access: write
      severity: Low
      security_notes: Nuisance vector - Assume it cannot block Admins
    - access: read
      severity: Informational
  needs_investigation: true
  doc_status: documented
  impact_plane: governance_identity
