- name: Members
  api_key: members
  category: organization
  overview: Manage organization members and teams.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Allows adding an attacker's identity directly to the org, bypassing IdP.
    - access: read
      severity: Critical
      security_notes: Allows adding an attacker's identity directly to the org, bypassing IdP.
  needs_investigation: false
  doc_status: documented
  impact_plane: governance_identity
- name: Actions variables
  api_key: organization_actions_variables
  category: organization
  overview: Manage organization-level Actions variables.
  access_levels:
    - access: write
      severity: Medium
      security_notes: Could manipulate CI/CD logic dependent on variables across the organization such as manipulate endpoint or inject variables. Specalative and the impact is project dependant.
    - access: read
      severity: Low
      security_notes: Information disclosure
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
- name: Administration
  api_key: organization_administration
  category: organization
  overview: Manage org-level settings, access, and rules.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Can change org-wide policies, invite malicious users, or disable SAML/SSO.
    - access: read
      severity: Medium
      security_notes: Enumerate org-wide policies and rules to determine a weakness or where to focus a takeover of in-use third party libraries or components.
  needs_investigation: false
  doc_status: documented
  impact_plane: control
