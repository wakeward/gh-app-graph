# See data/permissions/README.md
- name: Members
  api_key: members
  category: organization
  overview: Manage organization members and teams.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Add attacker accounts directly to the organization, bypass SSO/IdP provisioning, or alter team administration rights.
    - access: read
      severity: Medium
      security_notes: Enumerate member list, team hierarchies, and identify privileged administrators for targeted social engineering.
  needs_investigation: false
  doc_status: documented
  impact_plane: governance_identity
  platform_availability: all
- name: Actions variables
  api_key: organization_actions_variables
  category: organization
  overview: Manage organization-level Actions variables.
  access_levels:
    - access: write
      severity: High
      security_notes: Manipulate CI/CD environment variables across all organization pipelines (e.g. redirect build targets, alter registries).
    - access: read
      severity: Low
      security_notes: Information disclosure of non-secret configuration variables, infrastructure URLs, and build flags.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Administration
  api_key: organization_administration
  category: organization
  overview: Manage org-level settings, access, and rules.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Tier 0 org compromise - modify or disable org-wide rulesets (stripping branch protection), manage self-hosted runners (CI/CD hijacking and secret harvest), alter default repository permissions, invite malicious owners, or disable SAML/SSO.
    - access: read
      severity: Medium
      security_notes: Enumerate org-wide policies and rules to determine a weakness or where to focus a takeover of in-use third party libraries or components.
  needs_investigation: false
  doc_status: documented
  impact_plane: control
  platform_availability: all
