# DRAFT Repository permissions - NOT CANONICAL
# Seeded by cmd/migrate-csv from an incomplete working spreadsheet plus Enterprise
# UI observations. Severity/impact_plane are starting notes only. Replace or reconcile
# once fetch-inventory and detect-overlap produce the real endpoint graph.
# See data/permissions/README.md
- name: Actions
  api_key: actions
  category: repository
  overview: Manage workflows, workflow runs, and artifacts.
  access_levels:
    - access: write
      severity: High
      security_notes: Trigger arbitrary workflow runs with malicious input parameters or tamper with workflow artifacts.
    - access: read
      severity: Low
      security_notes: Download workflow artifacts and inspect CI/CD execution logs.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Actions variables
  api_key: actions_variables
  category: repository
  overview: Manage repository Actions and Dependabot variables.
  access_levels:
    - access: write
      severity: High
      security_notes: Manipulate build configuration variables to alter deployment targets or inject script parameters.
    - access: read
      severity: Low
      security_notes: Information disclosure of repository build configuration variables.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
  platform_availability: all
- name: Administration
  api_key: administration
  category: repository
  overview: Manage access, delete repos, change visibility, and manage branch protections.
  access_levels:
    - access: write
      severity: Critical
      security_notes: 'Full repo lifecycle control: disable branch protections, force-merge code, delete repos, or change private repos to public.'
    - access: read
      severity: Medium
      security_notes: Reconnaissance on branch protection rules, required approval counts, and collaborator permissions.
  needs_investigation: false
  doc_status: documented
  impact_plane: control
  platform_availability: all
- name: Agent secrets
  api_key: agent_secrets
  category: repository
  overview: Manage repository-level secrets for agent tasks. UNCONFIRMED KEY - inferred from docs.github.com endpoint /repos/{owner}/{repo}/agents/secrets; verify before use in automated rules.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Overwrite agent secrets to alter repository automated agent behaviors or redirect credentials.
    - access: read
      severity: Low
      security_notes: Does not return plaintext secrets (lists secret names and update dates). Reconnaissance only.
  needs_investigation: false
  doc_status: unconfirmed_key
  impact_plane: data_execution
  platform_availability: all
