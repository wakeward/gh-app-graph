- name: Actions
  api_key: actions
  category: repository
  overview: Manage workflows, workflow runs, and artifacts.
  access_levels:
    - access: write
      severity: High
      security_notes: Write access allows triggering workflows with malicious inputs or altering artifacts.
    - access: read
      severity: High
      security_notes: Write access allows triggering workflows with malicious inputs or altering artifacts.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
- name: Actions variables
  api_key: actions_variables
  category: repository
  overview: Manage repository Actions and Dependabot variables.
  access_levels:
    - access: write
      severity: Medium
      security_notes: Could manipulate CI/CD logic dependent on variables.
    - access: read
      severity: Medium
      security_notes: Could manipulate CI/CD logic dependent on variables.
  needs_investigation: false
  doc_status: documented
  impact_plane: data_execution
- name: Administration
  api_key: administration
  category: repository
  overview: Manage access, delete repos, change visibility, and manage branch protections.
  access_levels:
    - access: write
      severity: Critical
      security_notes: Full control over the repository lifecycle. Attackers can disable branch protections to force-merge bad code.
    - access: read
      severity: Critical
      security_notes: Full control over the repository lifecycle. Attackers can disable branch protections to force-merge bad code.
  needs_investigation: false
  doc_status: documented
  impact_plane: control
