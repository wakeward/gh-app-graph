toxic_combinations:
  - id: arbitrary-code-execution
    technique: Arbitrary Code Execution
    permissions:
      - api_key: workflows
        access: write
      - api_key: contents
        access: write
    blast_radius: Critical
    risk_description: Arbitrary Code Execution (Critical)
    exploit_path: The attacker pushes a malicious workflow file that executes arbitrary shell commands on the GitHub-hosted runner. Requires workflows:write (contents:write alone cannot modify .github/workflows/). Because the workflow runs in the context of the repository, the attacker can exfiltrate environment variables or access cloud provider credentials.
    overlaps_technical_dependency: false
    platform_availability: all
    source: migrate-toxic-combinations CSV
